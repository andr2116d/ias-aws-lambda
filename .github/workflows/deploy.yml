name: deploy
run-name: deploy ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno
        required: true
        type: choice
        options: [dev, qa, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - id: config
        working-directory: .
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          if compgen -G "envs/$ENV_NAME/*.tf" > /dev/null; then
            echo "has_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_config=false" >> "$GITHUB_OUTPUT"
            echo "::notice::envs/$ENV_NAME sin configuración, no hay nada que desplegar"
          fi

      - if: steps.config.outputs.has_config == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - if: steps.config.outputs.has_config == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        if: steps.config.outputs.has_config == 'true'
        run: terraform init -input=false

      - name: Validate
        if: steps.config.outputs.has_config == 'true'
        run: terraform validate -no-color

      - name: Plan
        if: steps.config.outputs.has_config == 'true'
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: steps.config.outputs.has_config == 'true'
        run: terraform apply -input=false -no-color tfplan
