name: pr-checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev, qa, main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conflictos:
    name: Conflictos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            let pr;
            for (let i = 0; i < 10; i++) {
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
              if (pr.mergeable !== null) break;
              await new Promise(r => setTimeout(r, 3000));
            }

            if (pr.mergeable === null) {
              return core.setFailed('No se pudo calcular el estado de conflictos.');
            }

            if (pr.mergeable === false) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: number,
                body: [
                  `PR cerrada: tiene conflictos con \`${pr.base.ref}\`.`,
                  '',
                  '```bash',
                  'git fetch origin',
                  `git rebase origin/${pr.base.ref}`,
                  'git push --force-with-lease',
                  '```',
                ].join('\n'),
              });
              await github.rest.pulls.update({ owner, repo, pull_number: number, state: 'closed' });
              return core.setFailed(`Conflictos con ${pr.base.ref}.`);
            }

  convenciones:
    name: Convenciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;

            const TYPES = 'feat|fix|refactor|docs|ci|chore|test|style';
            const SCOPES = 'network|storage|messaging|iam|lambda-upload|lambda-crop|apigw|observability|envs|ci';
            const MESSAGE = new RegExp(`^(${TYPES})(\\((${SCOPES})\\))?: (.+)$`, 'u');
            const BRANCH = new RegExp(`^(${TYPES})/[a-z0-9]+(-[a-z0-9]+)*$`);
            const MAX_LENGTH = 100;
            const SOURCE = { qa: 'dev', main: 'qa' };

            const errors = [];

            const check = (text, where) => {
              const subject = text.split('\n')[0];
              const match = subject.match(MESSAGE);
              if (!match) return errors.push(`${where}: formato inválido "${subject}"`);
              const description = match[4];
              if (/^[A-ZÁÉÍÓÚÑ]/u.test(description)) errors.push(`${where}: debe empezar en minúscula`);
              if (/[.\s]$/.test(description)) errors.push(`${where}: no debe terminar en punto`);
              if (subject.length > MAX_LENGTH) errors.push(`${where}: supera ${MAX_LENGTH} caracteres`);
            };

            if (base === 'dev') {
              if (!BRANCH.test(head)) errors.push(`Rama ${head}: formato tipo/scope-nombre`);
            } else if (head !== SOURCE[base]) {
              errors.push(`A ${base} solo se promueve desde ${SOURCE[base]}`);
            }

            check(pr.title, 'Título');

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: pr.number,
            });
            for (const c of commits) {
              if (c.parents.length > 1) continue;
              check(c.commit.message, `Commit ${c.sha.slice(0, 7)}`);
              if (!c.author) errors.push(`Commit ${c.sha.slice(0, 7)}: email no vinculado a una cuenta de GitHub`);
            }

            if (errors.length) return core.setFailed(errors.join('\n'));

  terraform:
    name: Terraform
    needs: conflictos
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v5

      - id: env
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            dev)  ENV_NAME=dev ;;
            qa)   ENV_NAME=qa ;;
            main) ENV_NAME=prod ;;
          esac
          echo "name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          if compgen -G "envs/$ENV_NAME/*.tf" > /dev/null; then
            echo "has_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_config=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive -diff

      - if: steps.env.outputs.has_config == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dependencias de las lambdas
        if: steps.env.outputs.has_config == 'true'
        working-directory: .
        run: |
          for pkg in src/*/package.json; do
            [ -f "$pkg" ] || continue
            dir="$(dirname "$pkg")"
            if [ ! -f "$dir/package-lock.json" ]; then
              echo "::error::$dir no tiene package-lock.json"
              exit 1
            fi
            npm ci --omit=dev --os=linux --cpu=x64 --prefix "$dir"
          done

      - if: steps.env.outputs.has_config == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        if: steps.env.outputs.has_config == 'true'
        working-directory: envs/${{ steps.env.outputs.name }}
        run: terraform init -input=false

      - name: Validate
        if: steps.env.outputs.has_config == 'true'
        working-directory: envs/${{ steps.env.outputs.name }}
        run: terraform validate -no-color

      - name: Plan
        id: plan
        if: steps.env.outputs.has_config == 'true'
        working-directory: envs/${{ steps.env.outputs.name }}
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt

      - name: Publicar plan
        if: always() && steps.plan.outcome != 'skipped' && steps.env.outputs.has_config == 'true'
        uses: actions/github-script@v8
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          PLAN_FILE: envs/${{ steps.env.outputs.name }}/plan.txt
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const MARKER = '<!-- terraform-plan -->';
            const MAX = 60000;

            let plan = fs.existsSync(process.env.PLAN_FILE)
              ? fs.readFileSync(process.env.PLAN_FILE, 'utf8')
              : 'Sin salida.';
            if (plan.length > MAX) plan = plan.slice(-MAX);

            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ['Ver detalle'])[0];

            const body = [
              MARKER,
              `### Terraform plan ${process.env.ENV_NAME.toUpperCase()} (${process.env.PLAN_OUTCOME})`,
              `**${summary}**`,
              '',
              '<details><summary>Plan completo</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `Commit: ${context.payload.pull_request.head.sha.slice(0, 7)}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.includes(MARKER));

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

  estructura:
    name: Estructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ vars.TF_VERSION }}
          terraform_wrapper: false

      - name: Estructura y validate
        run: bash scripts/validate.sh

